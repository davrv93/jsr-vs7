# Golden query mttr · definicion oficial del KPI. Se edita aqui y se regenera catalogo.json (herramientas/generar_catalogo.py).
kpi: mttr
nombre: "Tiempo de resolución (MTTR)"
version: 1
unidad: "minutos laborales"
dueno: Datos
definicion: "Tiempo desde que se crea la incidencia hasta su resolución, en minutos del calendario de su prioridad y sin contar las pausas (espera del usuario o de un tercero). Se informa la mediana y la media."
base: "Incidencias creadas en el periodo (dia de Lima) del grupo de origen elegido que tienen resolución vigente. Una abierta o reabierta no entra hasta que se vuelva a resolver."
parametros:
  - desde
  - hasta
  - grupo
atribucion_grupo: origen
columnas:
  - "evaluadas: incidencias resueltas"
  - "mediana_min: mediana en minutos"
  - "media_min: media en minutos"
bordes:
  - "Sin incidencias evaluadas: mediana y media NULL, nunca 0."
  - "Reabierta: el tiempo se mide hasta su ULTIMA resolucion y el tiempo entre una resolucion y su reapertura corre."
  - "Feriados, fines de semana y pausas largas no cuentan: lo calcula el backend en incidencias_tiempos."
  - "La pregunta «MTTR por categoria» no tiene golden query: esta solo filtra por grupo."
preguntas_equivalentes:
  - "¿Cuál fue el MTTR de septiembre?"
  - "¿Cuánto demoramos en resolver una incidencia?"
  - "Tiempo medio de resolución"
  - "¿Cuántos minutos laborales toma resolver un caso en promedio?"
  - "¿Cuál es la mediana del tiempo de resolución?"
  - "¿En cuánto tiempo se arregla un problema?"
pruebas:
  - archivo: esperado.csv
    desde: "2026-07-01"
    hasta: "2026-09-30"
    grupo: ""
  - archivo: esperado_septiembre.csv
    desde: "2026-09-01"
    hasta: "2026-09-30"
    grupo: ""
  - archivo: esperado_redes_agosto.csv
    desde: "2026-08-01"
    hasta: "2026-08-31"
    grupo: "Redes"
  - archivo: esperado_borde_31jul_1ago.csv
    desde: "2026-07-31"
    hasta: "2026-08-01"
    grupo: ""
  - archivo: esperado_grupo_sin_datos.csv
    desde: "2026-07-01"
    hasta: "2026-09-30"
    grupo: "Seguridad"
  - archivo: esperado_octubre.csv
    desde: "2026-10-01"
    hasta: "2026-10-05"
    grupo: ""
  - archivo: esperado_periodo_vacio.csv
    desde: "2026-12-01"
    hasta: "2026-12-31"
    grupo: ""
