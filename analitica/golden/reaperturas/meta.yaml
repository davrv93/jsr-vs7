# Golden query reaperturas · definicion oficial del KPI. Se edita aqui y se regenera catalogo.json (herramientas/generar_catalogo.py).
kpi: reaperturas
nombre: "Reaperturas en 7 días"
version: 1
unidad: "%"
dueno: Datos
definicion: "Porcentaje de incidencias resueltas que se reabrieron dentro de los 7 días siguientes a una resolución."
base: "Incidencias creadas en el periodo (dia de Lima) del grupo de origen elegido que tuvieron al menos una resolución. La ventana de 7 días (límite inclusivo) no se corta en el fin del periodo."
parametros:
  - desde
  - hasta
  - grupo
atribucion_grupo: origen
columnas:
  - "resueltas: incidencias con al menos una resolucion"
  - "reabiertas_7d: las que tuvieron una reapertura dentro de los 7 dias de una resolucion"
  - "porcentaje: reabiertas_7d / resueltas x 100, NULL si no hay resueltas"
bordes:
  - "Denominador cero: porcentaje NULL."
  - "Una reapertura a los 7 dias y 18 horas queda fuera de la ventana."
  - "Reabierta dos veces cuenta una sola vez."
  - "Las resoluciones de los ultimos 7 dias de los datos pueden subestimar el valor: todavia no tuvieron tiempo de reabrirse."
  - "Se lee de los eventos: hacen falta los instantes de la resolucion y de la reapertura."
preguntas_equivalentes:
  - "¿Cuántas incidencias se reabrieron?"
  - "Tasa de reapertura a 7 días"
  - "¿Qué porcentaje de las incidencias resueltas volvió a abrirse en una semana?"
  - "Reaperturas del mes"
  - "¿Estamos cerrando mal las incidencias?"
pruebas:
  - archivo: esperado.csv
    desde: "2026-07-01"
    hasta: "2026-09-30"
    grupo: ""
  - archivo: esperado_septiembre.csv
    desde: "2026-09-01"
    hasta: "2026-09-30"
    grupo: ""
  - archivo: esperado_redes_agosto.csv
    desde: "2026-08-01"
    hasta: "2026-08-31"
    grupo: "Redes"
  - archivo: esperado_borde_31jul_1ago.csv
    desde: "2026-07-31"
    hasta: "2026-08-01"
    grupo: ""
  - archivo: esperado_grupo_sin_datos.csv
    desde: "2026-07-01"
    hasta: "2026-09-30"
    grupo: "Seguridad"
  - archivo: esperado_octubre.csv
    desde: "2026-10-01"
    hasta: "2026-10-05"
    grupo: ""
  - archivo: esperado_periodo_vacio.csv
